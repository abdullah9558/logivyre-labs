<main><aside><div class="logo">L</div><div><b>Logivyre Labs</b><span>Release Console</span></div></aside><section><header><p>DESKTOP DISTRIBUTION</p><h1>Publish a Windows release.</h1><span>Upload signed installers to the portfolio download center.</span></header><div class="card"><label>Website API URL<input [(ngModel)]="apiUrl" type="url"></label><div class="row"><label>Product<select [(ngModel)]="product"><option>SimplePOS</option><option>TestMind AI</option><option>Mera Markaz</option></select></label><label>Version<input [(ngModel)]="version" placeholder="1.0.6"></label></div><label>Release admin key<input [(ngModel)]="adminKey" type="password" autocomplete="off"></label><label class="file"><input type="file" accept=".exe,.msi" (change)="choose($event)"><strong>{{file?.name || 'Choose a .exe or .msi installer'}}</strong><span>Installer bytes are stored in R2; searchable release details are stored in D1.</span></label><button (click)="publish()" [disabled]="busy()">{{busy() ? 'Publishing…' : 'Publish release'}}</button><p class="status">{{status()}}</p></div></section></main>
